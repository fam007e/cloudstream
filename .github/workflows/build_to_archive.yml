name: Archive Build

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '*.md'
      - '*.json'
      - '**/wcokey.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set outputs
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_B64 }}" | base64 --decode > "${RUNNER_TEMP}/keystore.jks"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Run Gradle
      run: ./gradlew assemblePrereleaseRelease -DGIT_HASH=${{ steps.vars.outputs.sha_short }}
      env:
        SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        PRERELEASE_STORE_FILE: ${{ runner.temp }}/keystore.jks
        SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
        SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
        MDL_API_KEY: ${{ secrets.MDL_API_KEY }}

    - name: Archive to GitHub Releases
      uses: marvinpinto/action-automatic-releases@latest
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "build-${{ steps.vars.outputs.sha_short }}"
        prerelease: true
        title: "Archive Build: ${{ steps.vars.outputs.sha_short }} (Run #${{ github.run_number }})"
        files: |
          app/build/outputs/apk/prerelease/release/*.apk
